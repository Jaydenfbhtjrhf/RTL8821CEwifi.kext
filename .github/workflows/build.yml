name: Build Kext
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: List project files
        run: ls -la
      - name: Build
        run: |
          xcodebuild -list -project *.xcodeproj || true
          xcodebuild -project *.xcodeproj -configuration Release build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTL8821CEwifi-kext
          path: build/Release/*.kext
