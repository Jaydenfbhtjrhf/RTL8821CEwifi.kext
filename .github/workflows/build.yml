name: Build Kext

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # This forces the macOS Sonoma build environment

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Force Xcode for Sonoma
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Compile Kext via Xcode Engine
        run: |
          # Automatically detects the xcodeproj file inside crangel660's repository
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          
          # Extracts the correct internal target scheme
          SCHEME_NAME=$(xcodebuild -list -project "$PROJ_FILE" | grep -A 5 "Targets:" | tail -n +2 | tr -d ' ' | head -n 1)
          
          echo "Compiling $PROJ_FILE using scheme: $SCHEME_NAME"
          
          # Compiles properly for Intel x86_64 architectures matching Hackintosh environments
          xcodebuild -project "$PROJ_FILE" -scheme "$SCHEME_NAME" -configuration Release ARCHS="x86_64" CONFIGURATION_BUILD_DIR=build-out

      - name: Upload Complete Kext Bundle
        uses: actions/upload-artifact@v4
        with:
          name: RTL8821CE-Kext-Package
          path: build-out/*.kext
