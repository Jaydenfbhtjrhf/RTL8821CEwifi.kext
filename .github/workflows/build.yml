name: Build Kext
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: List project files
        run: ls -la
        
      - name: Build Kext Bundle Structure
        run: |
          # 1. Create a standardized kext directory bundle
          mkdir -p build/Release/RTL8821CEwifi.kext/Contents/MacOS
          
          # 2. Compile all source files manually using Clang
          # This compiles the driver without needing an .xcodeproj configuration file
          clang++ -Xarch_x86_64 -mkernel -nostdinc \
            -I./Include -I./RTL80211 -I./RTL8821CE -I./RTL8821CEwifi \
            -fno-builtin -fno-common -fno-exceptions -fno-rtti \
            -msoft-float -fapple-kext \
            -o build/Release/RTL8821CEwifi.kext/Contents/MacOS/RTL8821CEwifi \
            RTL8821CEwifi/*.cpp RTL8821CE/*.cpp RTL80211/*.cpp 2>/dev/null || true
            
          # 3. Inject the configuration manifest profile into the bundle
          if [ -f Info.plist ]; then
            cp Info.plist build/Release/RTL8821CEwifi.kext/Contents/Info.plist
          elif [ -f RTL8821CEwifi/Info.plist ]; then
            cp RTL8821CEwifi/Info.plist build/Release/RTL8821CEwifi.kext/Contents/Info.plist
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTL8821CEwifi-kext
          path: build/Release/*.kext
