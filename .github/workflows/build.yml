name: Build Kext
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile sources
        run: |
          mkdir -p build/obj
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          CFLAGS="-arch arm64 -mkernel -nostdinc -fno-builtin -fno-common -fno-exceptions -fno-rtti -Iinclude -IRTL80211 -IRTL8821CE -I$SDK/System/Library/Frameworks/Kernel.framework/Headers -I$SDK/System/Library/Frameworks/Kernel.framework/PrivateHeaders"
          FAIL=0
          for f in $(find RTL80211 RTL8821CE -name "*.c" -o -name "*.cpp"); do
            OUT="build/obj/$(basename "$f").o"
            echo "Compiling $f"
            if [[ "$f" == *.cpp ]]; then
              clang++ $CFLAGS -std=c++17 -c "$f" -o "$OUT" || FAIL=1
            else
              clang $CFLAGS -c "$f" -o "$OUT" || FAIL=1
            fi
          done
          echo "FAIL=$FAIL" >> $GITHUB_ENV
      - name: Report status
        run: |
          echo "Any compile failures: $FAIL"
          ls -la build/obj | head -50
